# Done to increase the memory available to gradle.
org.gradle.jvmargs = -Xmx3G
org.gradle.configuration-cache = true

# Network: libraries.minecraft.net and friends are unreachable directly on this machine,
# route Gradle through the local HTTP proxy, keeping hosts that work directly off it.
systemProp.http.proxyHost = 127.0.0.1
systemProp.http.proxyPort = 2080
systemProp.https.proxyHost = 127.0.0.1
systemProp.https.proxyPort = 2080
systemProp.http.nonProxyHosts = repo1.maven.org|plugins.gradle.org|services.gradle.org|maven.cleanroommc.com|nexus.jsdu.cn
systemProp.https.nonProxyHosts = repo1.maven.org|plugins.gradle.org|services.gradle.org|maven.cleanroommc.com|nexus.jsdu.cn

# Cleanroom
cleanroom_version = 0.7.12-alpha

# Mod Properties
mod_version = 0.1.0
mod_id = vulkanmod
mod_name = VulkanMod

# LWJGL version must match the one shipped by Cleanroom
lwjgl_version = 3.4.3

# Run Configurations
minecraft_username = Developer
extra_jvm_args =

# Mixin: refmap the mixin config points at; enables the Mixin annotation processor
cg.userdev.refmap = mixins.vulkanmod.refmap.json

# Coremod
coremod_plugin_class = net.vulkanmod.coremod.VulkanModCore
coremod_includes_mod = true
