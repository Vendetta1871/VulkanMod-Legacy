# Done to increase the memory available to gradle.
org.gradle.jvmargs = -Xmx3G
org.gradle.configuration-cache = true

# Cleanroom
cleanroom_version = 0.7.12-alpha

# Mod Properties
mod_version = 0.3.1
mod_id = vesu
mod_name = Vesu

# LWJGL version must match the one shipped by Cleanroom
lwjgl_version = 3.4.3
# Gson as resolved by Cleanroom (pack-compiler compiles against it, see its build.gradle)
gson_version = 2.14.0

# Run Configurations
minecraft_username = Developer
extra_jvm_args =

# Mixin: refmap the mixin config points at; enables the Mixin annotation processor
cg.userdev.refmap = mixins.vesu.refmap.json

# Coremod
coremod_plugin_class = net.vesu.coremod.VesuCore
coremod_includes_mod = true
